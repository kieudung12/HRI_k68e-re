robot_skills:
  ros__parameters:
    use_sim_time: true
    planning_group: ur_manipulator
    home_target: up
    # Moderate speed-up for simulation; trajectory geometry and collision checks are unchanged.
    velocity_scaling: 0.25
    acceleration_scaling: 0.25
    approach_height: 0.05
    # Virtual grasp standoff keeps wrist_1 clear of the tabletop and cubes.
    grasp_offset: 0.15
    # tool +Z points down: 180 degrees about world X.
    tool_quaternion: [1.0, 0.0, 0.0, 0.0]
